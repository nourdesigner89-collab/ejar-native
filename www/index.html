<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>اجار</title>
<meta name="description" content="تطبيق اجار لإدارة تأجير الشاليهات والمزارع والسيارات والشقق، مع تقويم حجوزات وإدارة إيرادات ومصاريف.">
<meta name="theme-color" content="#14171e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151c;
    --surface:#1b202b;
    --surface-2:#242a37;
    --surface-3:#2c3342;
    --line:#333c4d;
    --cream:#f4f0e6;
    --cream-dim:#c9c3b3;
    --gold:#d4af37;
    --gold-deep:#b8862f;
    --gold-soft:#e8cd7a;
    --green:#2fa370;
    --red:#d1544a;
    --orange:#e0912f;
    --blue:#3f7cb0;
    --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="light"]{
    --ink:#f7f4ee;
    --surface:#ffffff;
    --surface-2:#f0ede4;
    --surface-3:#e6e2d6;
    --line:#ddd7c8;
    --cream:#0e0c08;
    --cream-dim:#454031;
    --gold:#b8862f;
    --gold-deep:#96691f;
    --gold-soft:#8a6620;
    --green:#1f8a5c;
    --red:#c23f36;
    --orange:#c47418;
    --blue:#2f5f8f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--ink);
    color:var(--cream);
    min-height:100vh;
    min-height:100dvh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3,h4{font-family:'Cairo',sans-serif; margin:0;}
  .brand-font{font-family:'Aref Ruqaa', serif;}

  /* ---------- App shell (fills the real device screen — no decorative phone frame) ---------- */
  .phone{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--ink);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }

  .appbar{
    padding:calc(18px + env(safe-area-inset-top)) 18px 12px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(180deg, #171b24, rgba(23,27,36,0));
    flex-shrink:0;
  }
  .appbar h2{font-size:19px; color:var(--cream); flex:1;}
  .appbar .sub{font-size:12px; color:var(--cream-dim); font-weight:500;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px; background:var(--surface-2);
    display:flex;align-items:center;justify-content:center; border:1px solid var(--line);
    flex-shrink:0; cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-3);}
  .icon-btn svg{width:19px;height:19px;}

  .screen{
    flex:1; overflow-y:auto; overflow-x:hidden;
    padding: 4px 18px 100px;
    -webkit-overflow-scrolling:touch;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; background:rgba(23,27,36,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:10px 6px calc(14px + var(--safe-b));
    z-index:500;
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--cream-dim); font-size:10.5px; font-weight:700; cursor:pointer;
  }
  .navitem svg{width:21px;height:21px; opacity:.75;}
  .navitem.active{color:var(--gold-soft);}
  .navitem.active svg{opacity:1;}

  /* ---------- Home ---------- */
  .hero{
    padding:22px 2px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
  }
  .hero .wordmark{
    font-family:'Aref Ruqaa',serif; font-size:46px; line-height:1.3; letter-spacing:1px;
    background:linear-gradient(160deg,#f3dfa0,#d4af37 55%,#b8862f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    padding-bottom:6px;
  }
  .hero .tag{font-size:12.5px; color:var(--cream-dim); font-weight:600; letter-spacing:.3px;}

  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
  .cat-card{
    background:linear-gradient(160deg,var(--surface-2),var(--surface));
    border:1px solid var(--line); border-radius:20px; padding:18px 14px;
    display:flex; flex-direction:column; gap:14px; cursor:pointer;
    position:relative; overflow:hidden; min-height:132px;
    transition:transform .15s ease;
  }
  .cat-card:active{transform:scale(.97);}
  .cat-card .glow{
    position:absolute; inset:-40% -40% auto auto; width:140px;height:140px;
    background:radial-gradient(circle, rgba(212,175,55,.16), transparent 70%);
  }
  .cat-card .icon-wrap{
    width:50px;height:50px;border-radius:14px;
    background:linear-gradient(145deg,#3a3222,#211d14);
    border:1px solid #4a3f24;
    display:flex;align-items:center;justify-content:center;
  }
  .cat-card .icon-wrap svg{width:27px;height:27px;}
  .cat-card .name{font-family:'Cairo'; font-weight:700; font-size:15.5px;}
  .cat-card .count{font-size:11.5px; color:var(--cream-dim);}

  .section-title{font-family:'Cairo'; font-weight:700; font-size:14.5px; color:var(--cream); margin:22px 0 10px;}

  .quick-row{display:flex; gap:10px;}
  .quick-btn{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
    padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
  }
  .quick-btn svg{width:20px;height:20px;}
  .quick-btn span{font-size:11px; font-weight:700;}

  /* ---------- Search bar ---------- */
  .search-bar{
    display:flex; align-items:center; gap:8px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0 14px;
  }
  .search-bar svg{width:17px;height:17px; opacity:.6; flex-shrink:0;}
  .search-bar input{
    background:none;border:none;outline:none;color:var(--cream); font-family:'Tajawal'; font-size:14px; flex:1;
  }
  .filter-chips{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .chip{
    padding:6px 14px; border-radius:100px; background:var(--surface-2); border:1px solid var(--line);
    font-size:12px; font-weight:700; color:var(--cream-dim); white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--gold); color:#20180a; border-color:var(--gold);}

  /* ---------- Unit list ---------- */
  .unit-card{
    display:flex; align-items:center; gap:12px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; cursor:pointer;
  }
  .unit-card .thumb{
    width:56px;height:56px;border-radius:12px; flex-shrink:0;
    background:linear-gradient(145deg,#3a3222,#211d14); border:1px solid #4a3f24;
    display:flex;align-items:center;justify-content:center;
  }
  .unit-card .thumb svg{width:28px;height:28px;}
  .unit-card .info{flex:1; min-width:0;}
  .unit-card .info .n{font-family:'Cairo'; font-weight:700; font-size:14.5px;}
  .unit-card .info .m{font-size:11.5px; color:var(--cream-dim); margin-top:3px;}
  .status-dot{width:10px;height:10px;border-radius:50%; flex-shrink:0;}
  .card-actions{display:flex; gap:6px; flex-shrink:0; margin-inline-start:4px;}
  .mini-icon-btn{width:30px;height:30px;border-radius:9px; background:var(--surface-3); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .mini-icon-btn svg{width:14px;height:14px; opacity:.85;}
  .mini-icon-btn.danger{background:rgba(209,84,74,.15); border-color:rgba(209,84,74,.35); color:#ec8179;}

  /* ---------- Calendar ---------- */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin:6px 0 14px;}
  .month-nav .mtitle{font-family:'Cairo'; font-weight:800; font-size:20px; letter-spacing:.5px;}
  .month-nav .marrow{
    width:34px;height:34px;border-radius:10px; background:var(--surface-2); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .legend .li{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--cream-dim);}
  .legend .dot{width:9px;height:9px;border-radius:50%;}

  .weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px;}
  .weekdays span{text-align:center; font-size:10.5px; color:var(--cream-dim); font-weight:700;}
  .daysgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .day{
    aspect-ratio:1/1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; cursor:pointer; position:relative; color:#0f1116;
  }
  .day.empty-cell{visibility:hidden;}
  .day.avail{background:linear-gradient(160deg,#3bbd88,var(--green)); color:#08251a;}
  .day.rented{background:linear-gradient(160deg,#e4675d,var(--red)); color:#2a0806;}
  .day.prelim{background:linear-gradient(160deg,#f0a54e,var(--orange)); color:#301a02;}
  .day.settled{background:linear-gradient(160deg,#659fcc,var(--blue)); color:#071626;}
  .day.today{box-shadow:0 0 0 2px var(--gold-soft) inset;}
  .day .tag{position:absolute; bottom:3px; font-size:7px; font-weight:800; opacity:.75;}
  .day .paid-badge{
    position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%;
    background:#0f1116; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.25);
  }
  .day .paid-badge svg{width:9px; height:9px; stroke:#3bd67a; stroke-width:3;}

  .revenue-strip{
    display:flex; gap:10px; margin-top:18px;
  }
  .stat-card{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:12px;
  }
  .stat-card .lbl{font-size:10.5px; color:var(--cream-dim); font-weight:700;}
  .stat-card .val{font-family:'Cairo'; font-weight:800; font-size:16px; margin-top:4px;}
  .stat-card.green .val{color:var(--green);}
  .stat-card.red .val{color:#ec8179;}
  .stat-card.gold .val{color:var(--gold-soft);}

  .big-btn{
    width:100%; padding:15px; border-radius:16px; border:none; cursor:pointer;
    font-family:'Cairo'; font-weight:800; font-size:14.5px; margin-top:16px;
    background:linear-gradient(145deg,var(--gold-soft),var(--gold-deep)); color:#241a06;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .big-btn:active{filter:brightness(.94);}
  .big-btn.ghost{background:var(--surface-2); color:var(--cream); border:1px solid var(--line);}
  .big-btn.danger{background:linear-gradient(145deg,#e4675d,var(--red)); color:#2a0806;}
  .big-btn.blueish{background:linear-gradient(145deg,#659fcc,var(--blue)); color:#071626;}
  .big-btn svg{width:17px;height:17px;}

  /* ---------- Sheets / modals ---------- */
  .scrim{
    position:absolute; inset:0; background:rgba(4,5,8,.62); z-index:900;
    display:flex; align-items:flex-end; justify-content:center;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}

  .drawer-scrim{
    position:absolute; inset:0; background:rgba(4,5,8,.55); z-index:950;
    animation:fadeIn .18s ease;
  }
  .drawer-panel{
    position:absolute; top:0; bottom:0; left:0;
    width:84%; max-width:340px;
    background:var(--surface);
    border-left:1px solid var(--line);
    box-shadow: 12px 0 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
    animation: slideInLeft .22s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes slideInLeft{from{transform:translateX(-100%)} to{transform:translateX(0)}}
  .drawer-head{
    display:flex; align-items:center; gap:8px;
    padding:calc(16px + env(safe-area-inset-top)) 14px 14px;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .drawer-body{ flex:1; overflow-y:auto; padding:14px 14px calc(20px + var(--safe-b)); }
  .settings-menu-item{
    display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .settings-menu-icon{
    width:36px; height:36px; border-radius:10px; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--gold-soft);
  }
  .settings-menu-icon svg{width:17px; height:17px;}
  .settings-menu-item svg:last-child{width:16px; height:16px; opacity:.4; flex-shrink:0;}
  .sheet{
    width:100%; max-height:88%; background:var(--surface);
    border-radius:26px 26px 0 0; border:1px solid var(--line); border-bottom:none;
    display:flex; flex-direction:column;
    animation:slideUp .22s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:.4} to{transform:translateY(0); opacity:1}}
  .sheet .grabber{width:40px;height:4px;border-radius:3px;background:var(--line); margin:10px auto 4px;}
  .sheet-head{
    display:flex; align-items:center; gap:10px; padding:8px 18px 12px; border-bottom:1px solid var(--line);
  }
  .sheet-head h3{font-size:16px; flex:1;}
  .sheet-body{
    padding:16px 18px calc(22px + var(--safe-b));
    overflow-y:auto;
  }
  .sheet-actions{
    padding:14px 18px calc(20px + var(--safe-b));
    border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:10px;
    /* ensures action buttons always sit above the phone home-indicator gesture bar */
  }

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--cream-dim); font-weight:700; margin-bottom:6px;}
  .field input[type=text], .field input[type=tel], .field textarea, .field input[type=number]{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 12px; color:var(--cream); font-family:'Tajawal'; font-size:14px; outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--gold);}
  .field textarea{resize:none; min-height:64px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .tap-field{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:12px; color:var(--cream); font-size:14px; cursor:pointer; font-weight:700;
  }
  .tap-field svg{width:16px;height:16px; opacity:.7;}
  .hint{font-size:10.5px; color:var(--cream-dim); margin-top:5px;}

  .segmented{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px;}
  .segmented .seg{flex:1; text-align:center; padding:9px; font-size:12.5px; font-weight:700; color:var(--cream-dim); border-radius:9px; cursor:pointer;}
  .segmented .seg.active{background:var(--gold); color:#20180a;}

  /* mini calendar picker inside sheet */
  .mini-cal .weekdays span{color:var(--cream-dim);}
  .mini-cal .daysgrid{gap:4px;}
  .mini-cal .day{font-size:11.5px; aspect-ratio:1/1; background:var(--surface-2); color:var(--cream); font-weight:700;}
  .mini-cal .day.sel{background:var(--gold); color:#20180a;}
  .mini-cal .day.past{opacity:.3; pointer-events:none;}

  /* circular time picker */
  .clock-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .clock-readout{font-family:'Cairo'; font-size:34px; font-weight:800; letter-spacing:1px; color:var(--gold-soft);}
  .clock-face{position:relative; width:230px; height:230px;}
  .clock-num{
    position:absolute; width:34px; height:34px; margin:-17px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
    color:var(--cream-dim); cursor:pointer;
  }
  .clock-num.active{background:var(--gold); color:#20180a;}
  .clock-center{
    position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--gold);
  }
  .ampm-toggle{display:flex; gap:8px;}
  .ampm-toggle .a{
    padding:8px 20px; border-radius:100px; background:var(--surface-2); border:1px solid var(--line);
    font-weight:800; font-size:13px; color:var(--cream-dim); cursor:pointer;
  }
  .ampm-toggle .a.active{background:var(--gold); color:#20180a; border-color:var(--gold);}
  .clock-step-label{font-size:11.5px; color:var(--cream-dim); font-weight:700;}

  /* expense / revenue table */
  .table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .table th{color:var(--cream-dim); font-weight:700; text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); font-size:11px;}
  .table td{padding:9px 6px; border-bottom:1px solid #232936; }
  .table tr:last-child td{border-bottom:none;}
  .table.compact6{font-size:10px;}
  .table.compact6 th{padding:6px 3px; font-size:9px;}
  .table.compact6 td{padding:7px 3px;}
  .table.compact6 .mini-icon-btn{width:24px; height:24px; border-radius:7px;}
  .table.compact6 .mini-icon-btn svg{width:11px; height:11px;}
  .pill{padding:3px 9px; border-radius:100px; font-size:10px; font-weight:800;}
  .pill.rented{background:rgba(209,84,74,.18); color:#ec8179;}
  .pill.prelim{background:rgba(224,145,47,.18); color:#f0b567;}
  .pill.settled{background:rgba(63,124,176,.18); color:#8fbde3;}
  .pill.income{background:rgba(47,163,112,.18); color:#7fe0b3;}
  .pill.expense{background:rgba(209,84,74,.18); color:#ec8179;}

  .empty-state{text-align:center; padding:40px 10px; color:var(--cream-dim);}
  .empty-state svg{width:44px;height:44px; opacity:.4; margin-bottom:10px;}
  .empty-state p{font-size:13px;}

  .toast{
    position:absolute; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--line); padding:10px 18px; border-radius:100px;
    font-size:12.5px; font-weight:700; z-index:2000; box-shadow:0 10px 24px rgba(0,0,0,.4);
    animation:toastIn .2s ease;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}

  .stepper{display:flex; align-items:center; gap:12px;}
  .stepper button{
    width:34px;height:34px;border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--cream); font-size:16px; cursor:pointer;
  }
  .stepper .v{font-family:'Cairo'; font-weight:800; font-size:15px; min-width:46px; text-align:center;}

  .switch{width:44px;height:26px;border-radius:100px; background:var(--surface-3); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0;}
  .switch .knob{position:absolute; top:2px; right:2px; width:20px;height:20px;border-radius:50%; background:var(--cream-dim); transition:.15s;}
  .switch.on{background:var(--gold); border-color:var(--gold);}
  .switch.on .knob{right:20px; background:#20180a;}

  .setting-row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px;}
  .setting-row .txt{flex:1;}
  .setting-row .t1{font-weight:700; font-size:13.5px;}
  .setting-row .t2{font-size:11px; color:var(--cream-dim); margin-top:3px;}

  .reminder-item{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:11px; margin-bottom:9px;}
  .reminder-item .rb{width:36px;height:36px;border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .reminder-item .rb svg{width:17px;height:17px;}
  .reminder-item .t1{font-weight:700; font-size:13px;}
  .reminder-item .t2{font-size:11px; color:var(--cream-dim); margin-top:2px;}
</style>
</head>

<div id="boot-splash" style="position:fixed; inset:0; background:var(--ink); z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;">

function reminderLabel(mins){
  if(mins < 60) return mins + ' دقيقة';
  if(mins % 60 === 0){
    const h = mins/60;
    return h===1?'ساعة':(h===2?'ساعتين':h+' ساعات');

  return Math.floor(mins/60) + ' س ' + (mins%60) + ' د';
}

/* ============================= REMINDER ENGINE (works while the app is open/running) ============================= */
const NOTIFIED_KEY = 'ejar_notified_v1';
function getNotifiedSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY)||'[]')); }catch(e){ return new Set(); }
}
function markNotified(key){
  const s = getNotifiedSet(); s.add(key);
  try{ localStorage.setItem(NOTIFIED_KEY, JSON.stringify([...s])); }catch(e){}
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.6);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.6);
  }catch(e){}
}
// On Android Chrome, once a Service Worker controls the page, `new Notification()`
// throws "Illegal constructor" — notifications must go through the SW registration instead.
async function showAppNotification(title, options){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      if(reg && reg.showNotification){
        await reg.showNotification(title, options);
        return true;
      }
    }
    new Notification(title, options);
    return true;
  }catch(e){
    return false;
  }
}
function fireReminder(b, field, label){
  const u = unitById(b.unitId);
  const title = 'تذكير ' + label;
  const time = field==='checkin' ? b.checkin : b.checkout;
  const body = `${u.name} — ${b.name} · الساعة ${time}`;
  playBeep();
  if('Notification' in window && Notification.permission==='granted'){
    showAppNotification(title, {body, icon:'icon-192.png'}).then(ok=>{ if(!ok) toast(title+': '+body); });
  } else {
    toast(title + ': ' + body);
  }
}
function checkReminders(){
  if(!NOTIF.enabled) return;
  const now = new Date();
  const notified = getNotifiedSet();
  BOOKINGS.forEach(b=>{
    if(!b.name) return;
    [['checkin', NOTIF.beforeCheckin, 'الاستلام'], ['checkout', NOTIF.beforeCheckout, 'التسليم']].forEach(([field, mins, label])=>{
      const t = b[field];
      if(!t) return;
      const key = b.id+':'+field;
      if(notified.has(key)) return;
      const [hh,mm] = t.split(':').map(Number);
      const eventDt = new Date(b.date+'T00:00:00');
      eventDt.setHours(hh, mm, 0, 0);
      const notifyAt = new Date(eventDt.getTime() - mins*60000);
      if(now >= notifyAt && now <= eventDt){
        fireReminder(b, field, label);
        markNotified(key);
      }
    });
  });
}

const LS_KEY = 'ejar_app_data_v1';
const THEME_KEY = 'ejar_theme_pref';
function getThemePref(){
  try{ return localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){ return 'dark'; }
}
function setThemePref(pref){
  try{ localStorage.setItem(THEME_KEY, pref); }catch(e){}
  applyTheme();
}
function applyTheme(){
  const pref = getThemePref();
  let resolved = pref;
  if(pref==='auto'){
    resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', resolved==='light' ? 'light' : 'dark');
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if(metaTheme) metaTheme.setAttribute('content', resolved==='light' ? '#f7f4ee' : '#0d0f14');
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
    if(getThemePref()==='auto') applyTheme();
  });
}

function scheduleCloudSync(){
  if(!authUser || !cloudDb) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(pushToCloud, 1200);
}
async function pushToCloud(){
  if(!authUser) return;
  if(!cloudDb){ syncStatus='offline'; refreshSyncBadge(); return; }
  syncStatus = 'syncing'; refreshSyncBadge();
  const updatedAt = Date.now();
  lastAppliedUpdatedAt = updatedAt; // set BEFORE writing — Firestore fires an immediate local echo
                                     // of our own write before the server confirms; this stops that
                                     // echo from being treated as a "remote change" and re-rendering.
  const payload = {UNITS, BOOKINGS, EXPENSES, NOTIF, unitSeq, idSeq, pinnedUnitId, updatedAt, updatedBy: getUserName()||authUser.email||'مستخدم', ownerPin: accountOwnerPin, subscriptionExpiresAt: subscriptionExpiresAt};
  try{
    await cloudDb.collection('backups').doc(authUser.uid).set(payload);
    syncStatus = 'synced';
  }catch(e){
    syncStatus = 'error';
  }
  refreshSyncBadge();
}
async function pullFromCloud(uid){
  if(!cloudDb) return {status:'no-db'};
  try{
    const doc = await cloudDb.collection('backups').doc(uid).get();
    return doc.exists ? {status:'found', data:doc.data()} : {status:'not-found'};
  }catch(e){
    return {status:'error', error:e};
  }
}
function applyCloudData(data){
  if(Array.isArray(data.UNITS)) UNITS = data.UNITS;
  if(Array.isArray(data.BOOKINGS)) BOOKINGS = data.BOOKINGS;
  if(Array.isArray(data.EXPENSES)) EXPENSES = data.EXPENSES;
  if(data.NOTIF) NOTIF = data.NOTIF;
  if(typeof data.unitSeq==='number') unitSeq = data.unitSeq;
  if(typeof data.idSeq==='number') idSeq = data.idSeq;
  if(data.pinnedUnitId!==undefined) pinnedUnitId = data.pinnedUnitId;
  if(data.ownerPin!==undefined) accountOwnerPin = data.ownerPin;
  if(data.subscriptionExpiresAt!==undefined) subscriptionExpiresAt = data.subscriptionExpiresAt;
}
function refreshSyncBadge(){
  const el = document.getElementById('syncStatusBadge');
  if(!el) return;
  const map = {
    idle:'—', syncing:'جاري المزامنة...', synced:'✔ مباشر — أي تغيير يوصلك فورًا',
    error:'تعذر الاتصال بالإنترنت', offline:'بدون اتصال'
  };
  el.textContent = map[syncStatus] || '';
}

/* Live listener: reflects changes from ANY device signed into the same account immediately */
function startCloudListener(uid){
  if(!cloudDb || !uid) return;
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = cloudDb.collection('backups').doc(uid).onSnapshot(
    (doc)=>{
      if(!doc.exists) return;
      const data = doc.data();
      if(!data.updatedAt || data.updatedAt <= lastAppliedUpdatedAt) return;
      const isOwnEcho = data.updatedBy===(getUserName()||authUser?.email) && (Date.now()-data.updatedAt) < 4000;
      lastAppliedUpdatedAt = data.updatedAt;
      applyCloudData(data);
      saveStateLocalOnly();
      if(!isOwnEcho){
        toast(`تحديث جديد من ${data.updatedBy||'مستخدم آخر'}`);
      }
      syncStatus = 'synced';
      render();
    },

function persistLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({UNITS, BOOKINGS, EXPENSES, NOTIF, unitSeq, idSeq, pinnedUnitId, updatedAt: Date.now()}));
  }catch(e){ /* storage unavailable — app still works, just won't persist */ }
}
function saveState(){
  persistLocal();
  scheduleCloudSync();
}
function saveStateLocalOnly(){
  persistLocal();
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(Array.isArray(data.UNITS)) UNITS = data.UNITS;
    if(Array.isArray(data.BOOKINGS)) BOOKINGS = data.BOOKINGS;
    if(Array.isArray(data.EXPENSES)) EXPENSES = data.EXPENSES;
    if(data.NOTIF){
      NOTIF = data.NOTIF;
      // migrate old hour-based values (pre-update) to minutes
      if(NOTIF.beforeCheckin!==undefined && NOTIF.beforeCheckin < 15) NOTIF.beforeCheckin *= 60;
      if(NOTIF.beforeCheckout!==undefined && NOTIF.beforeCheckout < 15) NOTIF.beforeCheckout *= 60;
    }
    if(typeof data.unitSeq==='number') unitSeq = data.unitSeq;
    if(typeof data.idSeq==='number') idSeq = data.idSeq;
    if(data.pinnedUnitId) pinnedUnitId = data.pinnedUnitId;
    return true;
  }catch(e){ return false; }
}

/* ============================= BACK BUTTON / HISTORY HANDLING ============================= */
let navStack = [{type:'view', view:'home', extra:{}}];
let suppressPopstate = false;
let backPressArmed = false;
let backPressTimer = null;

function pushHistoryEntry(){
  history.pushState({navLen: navStack.length}, '', location.pathname + location.search);
}
function popNavIfModalTop(){
  if(navStack.length>1 && (navStack[navStack.length-1].type==='modal' || navStack[navStack.length-1].type==='drawer')){
    navStack.pop();
    suppressPopstate = true;
    history.back();
  }
}

window.addEventListener('popstate', ()=>{
  if(suppressPopstate){ suppressPopstate = false; return; }

  if(navStack.length > 1){
    const popped = navStack.pop();
    if(popped.type==='modal'){
      state.modal = null;
      renderModal();
    }
    if(popped.type==='drawer'){
      settingsDrawerOpen = false;
      renderSettingsDrawer();
    }
    const top = navStack[navStack.length-1];
    if(top.type==='view'){
      state = {...state, view: top.view, ...top.extra};
      render();
    }
    return;
  }

  // Already at the base screen — this back press is trying to leave the app
  if(!backPressArmed){
    backPressArmed = true;
    toast('اضغط رجوع مرة أخرى للخروج');
    pushHistoryEntry(); // re-arm: cancels this exit attempt
    clearTimeout(backPressTimer);
    backPressTimer = setTimeout(()=>{ backPressArmed = false; }, 2000);
  }
  // if already armed (second press within 2s), we do nothing — the app is allowed to exit
});

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.getElementById('phone').appendChild(t);
  setTimeout(()=>t.remove(), 1600);
}

// JS getDay(): 0=Sun..6=Sat. We want week to start Saturday -> map Sat=0
function weekdayIndexSat(y,m,d){
  const jsDay = new Date(y,m-1,d).getDay(); // 0 Sun..6 Sat
  return (jsDay+1)%7; // Sat=0, Sun=1 ... Fri=6
}

async function copyToClipboard(text, successMsg){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast(successMsg || 'تم النسخ');
  }catch(e){
    toast('تعذّر النسخ — انسخه يدويًا');
  }
}

  else if(state.view==='settings'){ title='الإعدادات'; backTo=()=>go('home'); }
  else if(state.view==='settings-account'){ title='الحساب'; backTo=()=>go('home'); }
  else if(state.view==='settings-theme'){ title='المظهر'; backTo=()=>go('home'); }
  else if(state.view==='settings-subscription'){ title='الاشتراك'; backTo=()=>go('home'); }

  else if(state.view==='settings-about'){ title='حول التطبيق'; backTo=()=>go('home'); }
  else if(state.view==='settings-contact'){ title='تواصل مع المطوّر'; backTo=()=>go('home'); }

  if(state.view==='home'){
    slot.innerHTML = `<div class="appbar">
      <div style="flex:1"></div>
      <div class="icon-btn" id="backupBtn">${icon('settings')}</div>
    </div>`;
    document.getElementById('backupBtn').onclick = ()=> openSettingsDrawer();
    return;
  }
  slot.innerHTML = `<div class="appbar">
    ${backTo?`<div class="icon-btn" id="backBtn">${icon('back')}</div>`:''}
    <div style="flex:1">
      <h2>${title}</h2>
      ${sub?`<div class="sub">${sub}</div>`:''}
    </div>
    ${extraBtn}
  </div>`;

    if(pinnedUnitId===state.unitId){ pinnedUnitId=null; toast('تم إلغاء تثبيت الشاشة الرئيسية'); }
    else { pinnedUnitId=state.unitId; toast('صارت هذي الوحدة هي الشاشة الرئيسية'); }
    saveState();
    renderAppbar();
  };
}

function renderBottomnav(){

function getPeriodRange(mode, anchorStr){
  const anchor = new Date((anchorStr||todayStr())+'T00:00:00');
  if(mode==='week'){
    const day = anchor.getDay();
    const diff = (day+1)%7; // days since Saturday (app week starts Saturday)
    const start = new Date(anchor); start.setDate(anchor.getDate()-diff);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return {start, end};
  }
  if(mode==='month'){
    const start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const end = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
    return {start, end};
  }
  return null;
}
function fmtShort(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function periodLabel(mode, anchorStr){
  const now = todayStr();
  const range = getPeriodRange(mode, anchorStr);
  if(!range) return 'كل الفترات';
  if(mode==='month') return pad(range.start.getMonth()+1)+' / '+range.start.getFullYear();
  const label = fmtShort(range.start)+' — '+fmtShort(range.end);
  const curRange = getPeriodRange('week', now);
  if(mode==='week' && range.start.getTime()===curRange.start.getTime()) return 'هذا الأسبوع (' + label + ')';
  return label;
}
function shiftRevenueAnchor(dir){
  const mode = state.revenueMode;
  const anchor = new Date((state.revenueAnchor||todayStr())+'T00:00:00');
  if(mode==='week') anchor.setDate(anchor.getDate()+7*dir);
  else if(mode==='month') anchor.setMonth(anchor.getMonth()+dir);
  state.revenueAnchor = ymd(anchor.getFullYear(), anchor.getMonth()+1, anchor.getDate());
}
function inRevenuePeriod(dateStr, mode, anchorStr){
  const range = getPeriodRange(mode, anchorStr);
  if(!range) return true;
  const d = new Date(dateStr+'T00:00:00');
  return d>=range.start && d<=range.end;
}

  exps.forEach(e=> txns.push({type:'expense', date:e.date, sortKey:e.date+'b', id:e.id, expense:e}));

function notificationsTabContent(){

/* ============================= EVENTS PER SCREEN ============================= */
function bindUnitListEvents(){
  document.querySelectorAll('[data-unit]').forEach(el=> el.onclick=()=>go('unit',{unitId:el.dataset.unit}));
  document.querySelectorAll('[data-edit-unit]').forEach(el=> el.onclick=(ev)=>{ ev.stopPropagation(); openUnitForm({editId:el.dataset.editUnit}); });
  document.querySelectorAll('[data-del-unit]').forEach(el=> el.onclick=(ev)=>{ ev.stopPropagation(); confirmDeleteUnit(el.dataset.delUnit); });
}

function bindScreenEvents(){
  document.querySelectorAll('[data-cat]').forEach(el=> el.onclick=()=>go('category',{catId:el.dataset.cat}));
  document.querySelectorAll('[data-nav]').forEach(el=> el.onclick=()=>go(el.dataset.nav));
  bindUnitListEvents();

  const addUnitBtn = document.getElementById('addUnitBtn');
  if(addUnitBtn) addUnitBtn.onclick = ()=> openUnitForm({catId: state.catId});

  const unitSearch = document.getElementById('unitSearch');
  if(unitSearch){
    unitSearch.oninput = ()=>{
      const q = unitSearch.value.trim();
      const list = unitsOf(state.catId).filter(u=>u.name.includes(q) || u.loc.includes(q));
      document.getElementById('unitList').innerHTML = renderUnitList(list);
      bindUnitListEvents();
    };
  }

  const prevM = document.getElementById('prevMonth'), nextM = document.getElementById('nextMonth');
  if(prevM) prevM.onclick = ()=>{ let m=state.calMonth-1, y=state.calYear; if(m<1){m=12;y--;} go('unit',{calMonth:m, calYear:y}); };
  if(nextM) nextM.onclick = ()=>{ let m=state.calMonth+1, y=state.calYear; if(m>12){m=1;y++;} go('unit',{calMonth:m, calYear:y}); };

  document.querySelectorAll('.day[data-date]').forEach(el=>{
    el.onclick = ()=>{
      const date = el.dataset.date;
      const b = bookingOnDate(state.unitId, date);
      if(b) openDayDetail(b);
      else openBookingForm({unitId:state.unitId, date});
    };
  });

  const goRevenue = document.getElementById('goRevenue');
  if(goRevenue) goRevenue.onclick = ()=> go('revenue', {unitId:state.unitId});

  const addExpenseBtn = document.getElementById('addExpenseBtn');
  if(addExpenseBtn) addExpenseBtn.onclick = ()=> openExpenseForm(state.unitId);

  document.querySelectorAll('[data-mode]').forEach(el=>{
    el.onclick = ()=>{
      state.revenueMode = el.dataset.mode;
      state.revenueAnchor = todayStr();
      renderScreen();
    };
  });
  const prevPeriod = document.getElementById('prevPeriod');
  if(prevPeriod) prevPeriod.onclick = ()=>{ shiftRevenueAnchor(-1); renderScreen(); };
  const nextPeriod = document.getElementById('nextPeriod');
  if(nextPeriod) nextPeriod.onclick = ()=>{ shiftRevenueAnchor(1); renderScreen(); };
  document.querySelectorAll('[data-open-booking]').forEach(el=>{
    el.onclick = (ev)=>{
      if(ev.target.closest('[data-settle],[data-unsettle]')) return;
      const b = BOOKINGS.find(x=>x.id===el.dataset.openBooking);
      if(b) openDayDetail(b);
    };
  });
  document.querySelectorAll('[data-edit-expense]').forEach(el=>{
    el.onclick = ()=> openExpenseForm(state.unitId, el.dataset.editExpense);
  });
  document.querySelectorAll('[data-del-expense]').forEach(el=>{
    el.onclick = ()=> deleteExpense(el.dataset.delExpense);
  });

  document.querySelectorAll('[data-settle]').forEach(el=>{
    el.onclick = ()=>{ settleBooking(el.dataset.settle); };
  });
  document.querySelectorAll('[data-unsettle]').forEach(el=>{
    el.onclick = ()=>{ unsettleBooking(el.dataset.unsettle); };
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = ()=>{ state.searchQ = searchInput.value; renderScreen(); setTimeout(()=>{ const i=document.getElementById('searchInput'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); };
  }
  document.querySelectorAll('[data-filter]').forEach(el=> el.onclick=()=>{ state.searchFilter=el.dataset.filter; renderScreen(); });
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = ()=>{
      const [unitId,date] = el.dataset.goto.split('|');
      const u = unitById(unitId);
      go('unit',{unitId, calYear:+date.slice(0,4), calMonth:+date.slice(5,7)});
      setTimeout(()=>{ const b=bookingOnDate(unitId,date); if(b) openDayDetail(b); },50);
    };
  });
  document.querySelectorAll('[data-goto-unit]').forEach(el=>{
    el.onclick = ()=>{
      go('unit',{unitId: el.dataset.gotoUnit, calYear:new Date().getFullYear(), calMonth:new Date().getMonth()+1});
    };
  });

  const notifMaster = document.getElementById('notifMaster');
  if(notifMaster) notifMaster.onclick = ()=>{
    NOTIF.enabled=!NOTIF.enabled;
    if(NOTIF.enabled && 'Notification' in window && Notification.permission==='default'){
      Notification.requestPermission();
    }
    scheduleCloudSync();
    refreshSettingsOrScreen();
  };
  const testNotifBtn = document.getElementById('testNotifBtn');
  if(testNotifBtn) testNotifBtn.onclick = async ()=>{
    if(!('Notification' in window)){ toast('المتصفح ما يدعم الإشعارات'); return; }
    if(Notification.permission==='default'){
      const res = await Notification.requestPermission();
      if(res!=='granted'){ toast('لازم توافق على إذن الإشعارات من الجوال عشان تشتغل'); refreshSettingsOrScreen(); return; }
    }
    if(Notification.permission==='denied'){
      toast('الإذن ممنوع — روح إعدادات الجوال ← التطبيقات ← اجار ← الإشعارات وفعّله يدويًا');
      return;
    }
    playBeep();
    const ok = await showAppNotification('تجربة تنبيه اجار', {body:'إذا شفت هذا وسمعت صوت، الإشعارات شغّالة تمام ✔', icon:'icon-192.png'});
    if(!ok) toast('صار خطأ بعرض الإشعار — جرب تسكّر التطبيق وتفتحه من جديد');
    refreshSettingsOrScreen();
  };
  document.querySelectorAll('[data-ci-preset]').forEach(el=>{
    el.onclick = ()=>{ NOTIF.beforeCheckin = Number(el.dataset.ciPreset); scheduleCloudSync(); refreshSettingsOrScreen(); };
  });
  document.querySelectorAll('[data-co-preset]').forEach(el=>{
    el.onclick = ()=>{ NOTIF.beforeCheckout = Number(el.dataset.coPreset); scheduleCloudSync(); refreshSettingsOrScreen(); };
  });

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = exportBackup;

  const saveNameBtn = document.getElementById('saveNameBtn');
  if(saveNameBtn) saveNameBtn.onclick = ()=>{
    const nameInput = document.getElementById('userNameInput');
    setUserName(nameInput ? nameInput.value.trim() : '');
    toast('تم حفظ اسمك');
    scheduleCloudSync();
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = logOut;
  const syncNowBtn = document.getElementById('syncNowBtn');
  if(syncNowBtn) syncNowBtn.onclick = async ()=>{
    syncStatus='syncing'; refreshSyncBadge();
    await pushToCloud();
    toast(syncStatus==='synced' ? 'تمت المزامنة' : 'تعذر الاتصال، حاول لاحقًا');
  };
  refreshSyncBadge();

  document.querySelectorAll('[data-theme-pref]').forEach(el=>{
    el.onclick = ()=>{ setThemePref(el.dataset.themePref); refreshSettingsOrScreen(); };
  });
  const copyShamCashBtn2 = document.getElementById('copyShamCashBtn2');
  if(copyShamCashBtn2) copyShamCashBtn2.onclick = ()=> copyToClipboard(SHAMCASH_ACCOUNT, 'تم نسخ رقم الحساب');
  const rateAppBtn = document.getElementById('rateAppBtn');
  if(rateAppBtn) rateAppBtn.onclick = ()=>{
    if(PLAY_STORE_URL) window.open(PLAY_STORE_URL, '_blank');
    else toast('التطبيق لسا ما نُشر على المتجر — بنفعّل هذا الزر أول ما ننشره');
  };
  const shareAppBtn = document.getElementById('shareAppBtn');
  if(shareAppBtn) shareAppBtn.onclick = async ()=>{
    const shareData = {title:'اجار', text:'تطبيق اجار لإدارة تأجير العقارات والمركبات', url: location.href};
    try{
      if(navigator.share){ await navigator.share(shareData); }
      else { await copyToClipboard(location.href, 'تم نسخ رابط التطبيق — شاركه مع اللي تحب'); }
    }catch(e){ /* user cancelled share sheet — no-op */ }
  };
  const checkUpdateBtn = document.getElementById('checkUpdateBtn');
  if(checkUpdateBtn) checkUpdateBtn.onclick = async ()=>{
    toast('جاري التحقق من وجود تحديث...');
    try{
      if('serviceWorker' in navigator){
        const reg = await navigator.serviceWorker.getRegistration();
        if(reg) await reg.update();
      }
    }catch(e){}
    setTimeout(()=>{ location.reload(); }, 600);
  };
  const viewTermsBtn2 = document.getElementById('viewTermsBtn2');
  if(viewTermsBtn2) viewTermsBtn2.onclick = ()=> openModal({type:'terms'});

  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  if(importBtn && importFile){
    importBtn.onclick = ()=> importFile.click();
    importFile.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!Array.isArray(data.UNITS) || !Array.isArray(data.BOOKINGS)){
            toast('هذا الملف مو نسخة احتياطية صحيحة');
            return;
          }
          UNITS = data.UNITS;
          BOOKINGS = data.BOOKINGS;
          EXPENSES = Array.isArray(data.EXPENSES) ? data.EXPENSES : [];
          if(data.NOTIF) NOTIF = data.NOTIF;
          if(typeof data.unitSeq==='number') unitSeq = data.unitSeq;
          if(typeof data.idSeq==='number') idSeq = data.idSeq;
          pinnedUnitId = data.pinnedUnitId || null;
          saveState();
          toast('تم استعادة البيانات بنجاح');
          if(settingsDrawerOpen) closeSettingsDrawer();
          go('home');
        }catch(err){
          toast('تعذّرت قراءة الملف — تأكد إنه نسخة احتياطية صحيحة');
        }
      };
      reader.readAsText(file);
    };
  }
}

function exportBackup(){
  const data = {UNITS, BOOKINGS, EXPENSES, NOTIF, unitSeq, idSeq, pinnedUnitId, exportedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr().replace(/-/g,'');
  a.href = url;
  a.download = `ejar-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('جاري تنزيل النسخة الاحتياطية');
}

function renderModal(){
  const slot = document.getElementById('modal-slot');
  if(!state.modal){ slot.innerHTML=''; return; }
  const m = state.modal;
  if(m.type==='booking') slot.innerHTML = modalBookingForm(m);
  else if(m.type==='dayDetail') slot.innerHTML = modalDayDetail(m);
  else if(m.type==='datePicker') slot.innerHTML = modalDatePicker(m);
  else if(m.type==='timePicker') slot.innerHTML = modalTimePicker(m);
  else if(m.type==='expense') slot.innerHTML = modalExpenseForm(m);
  else if(m.type==='unitForm') slot.innerHTML = modalUnitForm(m);
  else if(m.type==='confirmDeleteUnit') slot.innerHTML = modalConfirmDeleteUnit(m);
  else if(m.type==='terms') slot.innerHTML = modalTerms(m);
  bindModalEvents();
}

function modalTimePicker(m){
  // m.field: 'checkin'|'checkout', m.value: 'HH:MM', m.step: 'hour'|'minute', m.hour12, m.ampm, m.minute
  const hourMarks = [];
  for(let i=1;i<=12;i++){
    const angle = (i%12)*30 - 90; // 12 at top
    const rad = angle*Math.PI/180;
    const r = 92;
    const x = 115 + r*Math.cos(rad), yv = 115 + r*Math.sin(rad);
    const active = m.step==='hour' && m.hour12===i;
    hourMarks.push(`<div class="clock-num ${active?'active':''}" style="left:${x}px; top:${yv}px" data-hour="${i}">${i}</div>`);
  }
  const minMarks = [];
  for(let i=0;i<12;i++){
    const val = i*5;
    const angle = i*30 - 90;
    const rad = angle*Math.PI/180;
    const r = 92;
    const x = 115 + r*Math.cos(rad), yv = 115 + r*Math.sin(rad);
    const active = m.step==='minute' && m.minute===val;
    minMarks.push(`<div class="clock-num ${active?'active':''}" style="left:${x}px; top:${yv}px" data-minute="${val}">${pad(val)}</div>`);
  }
  const readout = `${pad(m.hour12===12?12:m.hour12)}:${pad(m.minute)} ${m.ampm}`;
  return `
  <div class="scrim" id="scrim">
    <div class="sheet">
      <div class="grabber"></div>
      <div class="sheet-head"><h3>${m.field==='checkin'?'ساعة الاستلام':'ساعة التسليم'}</h3><div class="icon-btn" id="closeModal">${icon('back')}</div></div>
      <div class="sheet-body">
        <div class="clock-wrap">
          <div class="clock-readout">${readout}</div>
          <div class="clock-step-label">${m.step==='hour'?'اختر الساعة':'اختر الدقيقة'}</div>
          <div class="clock-face">
            ${m.step==='hour'?hourMarks.join(''):minMarks.join('')}
            <div class="clock-center"></div>
          </div>
          <div class="ampm-toggle">
            <div class="a ${m.ampm==='ص'?'active':''}" data-ampm="ص">ص</div>
            <div class="a ${m.ampm==='م'?'active':''}" data-ampm="م">م</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================= MODAL EVENTS ============================= */
function bindModalEvents(){
  const scrim = document.getElementById('scrim');
  if(!scrim) return;
  const closeBtn = document.getElementById('closeModal');
  if(closeBtn) closeBtn.onclick = closeModal;

  const m = state.modal;

  /* ---- booking form ---- */
  if(m.type==='booking'){
    document.getElementById('pickDate').onclick = ()=>{
      const [y,mo] = m.date.split('-').map(Number);
      openModal({...m, __back:'booking', type:'datePicker', py:y, pm:mo});
    };
    document.getElementById('pickCheckin').onclick = ()=> openTimePickerFor(m,'checkin');
    document.getElementById('pickCheckout').onclick = ()=> openTimePickerFor(m,'checkout');
    document.querySelectorAll('[data-status]').forEach(el=>{
      el.onclick = ()=>{ openModal({...m, status:el.dataset.status}); };
    });
    ['fName','fPhone','fNotes'].forEach(id=>{
      const el = document.getElementById(id); if(!el) return;
      el.oninput = ()=>{ m[id.replace('f','').toLowerCase()] = el.value; };
    });
    const fTotal = document.getElementById('fTotal'), fDeposit = document.getElementById('fDeposit'), fDamage = document.getElementById('fDamage');
    function recompute(){
      m.total = fTotal.value; m.deposit = fDeposit.value; m.damageFee = fDamage.value;
      const remain = (Number(m.total)||0) + (Number(m.damageFee)||0) - (Number(m.deposit)||0);
      document.getElementById('remainVal').textContent = fmtMoney(remain) + '';
    }
    fTotal.oninput = recompute; fDeposit.oninput = recompute; fDamage.oninput = recompute;
    // ensure field scrolls above the keyboard area instead of being hidden
    [fTotal, fDeposit, fDamage].forEach(el=>{
      el.addEventListener('focus', ()=>{
        setTimeout(()=>{ el.scrollIntoView({block:'center', behavior:'smooth'}); }, 120);
      });
    });
    document.getElementById('fName').addEventListener('focus', function(){
      setTimeout(()=>{ this.scrollIntoView({block:'center', behavior:'smooth'}); }, 120);
    });

    document.getElementById('saveBooking').onclick = ()=>{
      const name = document.getElementById('fName').value;
      const phone = document.getElementById('fPhone').value;
      const notes = document.getElementById('fNotes').value;
      const total = Number(document.getElementById('fTotal').value)||0;
      const deposit = Number(document.getElementById('fDeposit').value)||0;
      const damageFee = Number(document.getElementById('fDamage').value)||0;
      const by = getUserName() || null;
      if(m.editId){
        const b = BOOKINGS.find(x=>x.id===m.editId);
        Object.assign(b, {date:m.date, name, phone, checkin:m.checkin, checkout:m.checkout, total, deposit, damageFee, notes, status:m.status, updatedBy:by});
        toast('تم تحديث الحجز');
      } else {
        BOOKINGS.push({id:'b'+(idSeq++), unitId:m.unitId, date:m.date, name, phone, checkin:m.checkin, checkout:m.checkout, total, deposit, damageFee, notes, status:m.status, settled:false, createdBy:by, updatedBy:by});
        toast('تمت إضافة الحجز');
      }
      closeModal(); scheduleCloudSync(); renderScreen();
    };
    document.getElementById('cancelBooking').onclick = closeModal;
  }

  /* ---- day detail ---- */
  if(m.type==='dayDetail'){
    const b = BOOKINGS.find(x=>x.id===m.bookingId);
    const settleBtn = document.getElementById('settleBtn');
    if(settleBtn) settleBtn.onclick = ()=>{ b.settled=true; b.settledBy=getUserName()||null; toast('تم تسكير اليوم مع المحاسب'); scheduleCloudSync(); closeModal(); renderScreen(); };
    const unsettleBtn = document.getElementById('unsettleBtn');
    if(unsettleBtn) unsettleBtn.onclick = ()=>{ b.settled=false; b.settledBy=null; toast('تم التراجع عن التسكير'); scheduleCloudSync(); closeModal(); renderScreen(); };
    const editBtn = document.getElementById('editBtn');
    if(editBtn) editBtn.onclick = ()=>{ closeModal(); openBookingForm({unitId:b.unitId, date:b.date, editId:b.id}); };
    const deleteBtn = document.getElementById('deleteBtn');
    if(deleteBtn) deleteBtn.onclick = ()=>{
      BOOKINGS = BOOKINGS.filter(x=>x.id!==b.id);
      toast('تم حذف الحجز'); scheduleCloudSync(); closeModal(); renderScreen();
    };
  }

  /* ---- date picker (immediate select, no confirm) ---- */
  if(m.type==='datePicker'){
    document.getElementById('pdPrev').onclick = ()=>{ let mo=m.pm-1,y=m.py; if(mo<1){mo=12;y--;} openModal({...m, py:y, pm:mo}); };
    document.getElementById('pdNext').onclick = ()=>{ let mo=m.pm+1,y=m.py; if(mo>12){mo=1;y++;} openModal({...m, py:y, pm:mo}); };
    document.querySelectorAll('[data-pickdate]').forEach(el=>{
      el.onclick = ()=>{
        const date = el.dataset.pickdate;
        if(m.unitId!==undefined && m.date!==undefined && m.name!==undefined){
          // returning to booking form
          openModal({...m, type:'booking', date});
        } else {
          openModal({...m, type:'expense', date});
        }
      };
    });
  }

  /* ---- time picker (immediate, two-step, no confirm) ---- */
  if(m.type==='timePicker'){
    document.querySelectorAll('[data-hour]').forEach(el=>{
      el.onclick = ()=>{
        openModal({...m, hour12:Number(el.dataset.hour), step:'minute'});
      };
    });
    document.querySelectorAll('[data-minute]').forEach(el=>{
      el.onclick = ()=>{
        const minute = Number(el.dataset.minute);
        const hour24 = to24(m.hour12, m.ampm);
        const val = `${pad(hour24)}:${pad(minute)}`;
        const booking = m.__bookingState;
        booking[m.field] = val;
        closeModal();
        openModal({...booking, type:'booking'});
      };
    });
    document.querySelectorAll('[data-ampm]').forEach(el=>{
      el.onclick = ()=>{ openModal({...m, ampm:el.dataset.ampm}); };
    });
  }

  /* ---- expense form ---- */
  if(m.type==='expense'){
    document.getElementById('pickExpDate').onclick = ()=>{
      const [y,mo] = m.date.split('-').map(Number);
      openModal({...m, type:'datePicker', py:y, pm:mo});
    };
    document.getElementById('saveExpense').onclick = ()=>{
      const desc = document.getElementById('expDesc').value;
      const amount = Number(document.getElementById('expAmount').value)||0;
      if(!desc){ toast('أدخل بيان المصروف'); return; }
      if(m.editId){
        const e = EXPENSES.find(x=>x.id===m.editId);
        Object.assign(e, {date:m.date, desc, amount});
        toast('تم تحديث المصروف');
      } else {
        EXPENSES.push({id:'e'+(idSeq++), unitId:m.unitId, date:m.date, desc, amount});
        toast('تمت إضافة المصروف');
      }
      closeModal(); scheduleCloudSync(); renderScreen();
    };
    document.getElementById('cancelExpense').onclick = closeModal;
    const amtEl = document.getElementById('expAmount');
    amtEl.addEventListener('focus', function(){ setTimeout(()=> this.scrollIntoView({block:'center', behavior:'smooth'}), 120); });
  }

  /* ---- add / edit unit ---- */
  if(m.type==='unitForm'){
    const nameEl = document.getElementById('uName');
    nameEl.addEventListener('focus', function(){ setTimeout(()=> this.scrollIntoView({block:'center', behavior:'smooth'}), 120); });
    document.getElementById('saveUnit').onclick = ()=>{
      const name = document.getElementById('uName').value.trim();
      const loc = document.getElementById('uLoc').value.trim();
      const plateEl = document.getElementById('uPlate');
      const plate = plateEl ? plateEl.value.trim() : undefined;
      if(!name){ toast('أدخل اسم الوحدة'); return; }
      if(m.editId){
        const u = unitById(m.editId);
        u.name = name; u.loc = loc;
        if(plate!==undefined) u.plate = plate;
        toast('تم تحديث بيانات الوحدة');
      } else {
        const newUnit = {id:'u'+(unitSeq++), cat:m.catId, name, loc};
        if(plate!==undefined) newUnit.plate = plate;
        UNITS.push(newUnit);
        toast('تمت إضافة الوحدة');
      }
      closeModal(); scheduleCloudSync(); renderScreen();
    };
    document.getElementById('cancelUnit').onclick = closeModal;
  }

  /* ---- delete unit (custom confirm, no native confirm()) ---- */
  if(m.type==='confirmDeleteUnit'){
    document.getElementById('confirmDeleteUnitBtn').onclick = ()=>{
      UNITS = UNITS.filter(x=>x.id!==m.unitId);
      BOOKINGS = BOOKINGS.filter(b=>b.unitId!==m.unitId);
      EXPENSES = EXPENSES.filter(e=>e.unitId!==m.unitId);
      toast('تم حذف الوحدة');
      scheduleCloudSync();
      closeModal(); renderScreen();
    };
    document.getElementById('cancelDeleteUnitBtn').onclick = closeModal;
  }

  if(m.type==='terms'){
    const closeTermsBtn = document.getElementById('closeTermsBtn');
    if(closeTermsBtn) closeTermsBtn.onclick = closeModal;
  }
}

function openTimePickerFor(bookingState, field){
  const cur = bookingState[field];
  let hour24 = 16, minute = 0;
  if(cur){ [hour24, minute] = cur.split(':').map(Number); }
  const ampm = hour24>=12 ? 'م' : 'ص';
  let hour12 = hour24%12; if(hour12===0) hour12=12;
  openModal({type:'timePicker', field, step:'hour', hour12, minute, ampm, __bookingState: bookingState});
}
function to24(hour12, ampm){
  let h = hour12%12;
  if(ampm==='م') h += 12;
  return h;
}

/* ============================= INIT ============================= */
loadState();
if(pinnedUnitId && unitById(pinnedUnitId)){
  state.view = 'unit';
  state.unitId = pinnedUnitId;
  navStack = [{type:'view', view:'unit', extra:{unitId:pinnedUnitId}}];
}

// Offline-first bootstrap: if we've signed in on this device before, get the person
// straight into the app using locally-saved data immediately — don't make them wait
// on (or get blocked by) a network round-trip that might never come.
const cachedAuth = getCachedAuth();
if(cachedAuth){
  authUser = cachedAuth;
  authReady = true;
  const unlockState = getOwnerUnlockState(cachedAuth.uid);
  isOwnerMode = (unlockState==='owner');
  ownerGateNeeded = (unlockState==='none');
  if(!ownerGateNeeded) goToInitialScreen();
}

render();
const bootSplash = document.getElementById('boot-splash');
if(bootSplash) bootSplash.remove();

if(cloudDb && typeof firebase!=='undefined'){
  firebase.auth().onAuthStateChanged(async (user)=>{
    authUser = user;
    authReady = true;
    setCachedAuth(user);
    if(user){
      syncStatus = 'syncing';
      const result = await pullFromCloud(user.uid);
      const isFreshSignup = result.status==='not-found';
      if(result.status==='found'){
        applyCloudData(result.data);
        accountOwnerPin = result.data.ownerPin || null;
        lastAppliedUpdatedAt = result.data.updatedAt || Date.now();
        saveStateLocalOnly();
      } else if(result.status==='not-found'){
        accountOwnerPin = pendingSignupOwnerPin || null;
        subscriptionExpiresAt = Date.now() + TRIAL_DAYS*24*60*60*1000;
        await pushToCloud();
      } else {
        // network/read error — do NOT reset the trial or wipe cloud data.
        // Keep whatever was already loaded locally (from loadState() at boot)
        // and let the live listener (below) pick up the real state once connectivity returns.
        syncStatus = 'error';
        toast('تعذّر الاتصال بالسحابة الآن، يعمل التطبيق مؤقتًا ببياناته المحفوظة');
      }
      startCloudListener(user.uid);

      const unlockState = getOwnerUnlockState(user.uid);
      if(isFreshSignup || unlockState==='owner'){
        isOwnerMode = true;
        setOwnerUnlockState(user.uid, 'owner');
        ownerGateNeeded = false;
      } else if(unlockState==='staff'){
        isOwnerMode = false;
        ownerGateNeeded = false;
      } else {
        ownerGateNeeded = true;
        isOwnerMode = false;
      }
      pendingSignupOwnerPin = null;

      if(!ownerGateNeeded) goToInitialScreen();
    } else {
      stopCloudListener();
      isOwnerMode = false;
      ownerGateNeeded = false;
    }
    render();
  });
}

// Safety net: if Firebase never responds (blocked CDN, dead network, slow connection),
// don't leave the person staring at "جاري التحقق من الحساب..." forever.
setTimeout(()=>{
  if(!authReady){
    authReady = true;
    render();
  }
}, 7000);

// When connectivity returns, make sure nothing is left un-synced.
window.addEventListener('online', ()=>{
  if(!cloudDb || typeof firebase==='undefined'){
    // Firebase never loaded at all (was offline on cold start) — reloading now that
    // we're back online will fetch it fresh and pick up right where local data left off.
    location.reload();
    return;
  }
  if(authUser){
    if(!unsubscribeSnapshot) startCloudListener(authUser.uid);
    pushToCloud();
  }
});

if(NOTIF.enabled && 'Notification' in window && Notification.permission==='default'){
  Notification.requestPermission();
}
setTimeout(checkReminders, 3000);
setInterval(checkReminders, 30000);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
